<svg width="1000" height="300" viewBox="0 0 1000 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="35" height="35"
             patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.025"
            stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>

  <!-- Glow -->
  <circle cx="500" cy="130" r="120"
          fill="#8b5cf6"
          opacity="0.05"
          filter="url(#glow)"/>

  <!-- Terminal dots -->
  <circle cx="38" cy="32" r="5" fill="#ff5f57"/>
  <circle cx="58" cy="32" r="5" fill="#febc2e"/>
  <circle cx="78" cy="32" r="5" fill="#28c840"/>

  <text x="105" y="38"
        fill="#6e7681"
        font-family="monospace"
        font-size="13">
    ~/amelia/profile
  </text>

  <!-- Main title -->
  <text x="500" y="125"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-weight="700"
        font-size="52"
        letter-spacing="8">
    AMELIA
  </text>

  <text x="500" y="161"
        text-anchor="middle"
        fill="url(#purple)"
        font-family="monospace"
        font-size="16"
        letter-spacing="5">
    SOFTWARE DEVELOPER
  </text>

  <!-- Divider -->
  <line x1="335" y1="188"
        x2="665" y2="188"
        stroke="url(#purple)"
        stroke-width="1"
        opacity="0.55"/>

  <!-- Terminal subtitle -->
  <text x="500" y="225"
        text-anchor="middle"
        fill="#8b949e"
        font-family="monospace"
        font-size="15">
    &gt; turning ideas into code_
  </text>

  <!-- Decorative details -->
  <text x="45" y="265"
        fill="#8b5cf6"
        opacity="0.5"
        font-family="monospace"
        font-size="11">
    01 / build
  </text>

  <text x="955" y="265"
        text-anchor="end"
        fill="#8b5cf6"
        opacity="0.5"
        font-family="monospace"
        font-size="11">
    EC • 2026
  </text>

</svg>
