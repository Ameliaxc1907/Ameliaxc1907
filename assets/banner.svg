<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#10101A"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#B794F4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#B794F4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#FFFFFF"
            stroke-opacity="0.018"
            stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <ellipse cx="600"
           cy="175"
           rx="360"
           ry="230"
           fill="url(#glow)"/>

  <!-- Top terminal -->
  <circle cx="38" cy="32" r="5" fill="#FF5F57"/>
  <circle cx="58" cy="32" r="5" fill="#FEBC2E"/>
  <circle cx="78" cy="32" r="5" fill="#28C840"/>

  <text x="105"
        y="37"
        fill="#6E7681"
        font-family="monospace"
        font-size="13">
    ~/amelia
  </text>

  <!-- Coordinates -->
  <text x="1135"
        y="37"
        text-anchor="end"
        fill="#484F58"
        font-family="monospace"
        font-size="11"
        letter-spacing="2">
    01 / PROFILE
  </text>

  <!-- Side number -->
  <text x="255"
        y="155"
        fill="#B794F4"
        fill-opacity="0.55"
        font-family="monospace"
        font-size="12">
    01
  </text>

  <!-- Name -->
  <text x="600"
        y="157"
        text-anchor="middle"
        fill="#F0F6FC"
        font-family="Arial, sans-serif"
        font-weight="700"
        font-size="58"
        letter-spacing="16">
    AMELIA
  </text>

  <!-- Accent line -->
  <rect x="405"
        y="179"
        width="390"
        height="1"
        fill="url(#accent)"
        opacity="0.65"/>

  <!-- Role -->
  <text x="600"
        y="211"
        text-anchor="middle"
        fill="#B794F4"
        font-family="monospace"
        font-size="14"
        letter-spacing="6">
    SOFTWARE DEVELOPER
  </text>

  <!-- Keywords -->
  <text x="600"
        y="249"
        text-anchor="middle"
        fill="#6E7681"
        font-family="monospace"
        font-size="12"
        letter-spacing="3">
    CODE / SYSTEMS / LINUX / BUILD
  </text>

  <!-- Bottom command -->
  <text x="42"
        y="320"
        fill="#8B949E"
        font-family="monospace"
        font-size="13">
    &gt; currently building something
  </text>

  <!-- Animated cursor -->
  <rect x="250"
        y="307"
        width="7"
        height="16"
        rx="1"
        fill="#B794F4">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1.1s"
      repeatCount="indefinite"/>

  </rect>

  <!-- Bottom right -->
  <text x="1155"
        y="320"
        text-anchor="end"
        fill="#484F58"
        font-family="monospace"
        font-size="11"
        letter-spacing="2">
    EC / 2026
  </text>

  <!-- Tiny decorative cross -->
  <g stroke="#B794F4" stroke-opacity="0.35">
    <line x1="930" y1="110" x2="946" y2="110"/>
    <line x1="938" y1="102" x2="938" y2="118"/>
  </g>

  <g stroke="#B794F4" stroke-opacity="0.2">
    <line x1="275" y1="255" x2="287" y2="255"/>
    <line x1="281" y1="249" x2="281" y2="261"/>
  </g>

</svg>
